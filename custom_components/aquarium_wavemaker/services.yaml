set_wave:
  name: Set wave
  description: >-
    Send a wave mode to a pump right now, for testing. It is not saved. While the
    master toggle is on, the schedule replaces it within a minute; switch the master
    toggle off to hold it.
  target:
    entity:
      integration: aquarium_wavemaker
  fields:
    mode:
      name: Mode
      description: Wave mode.
      required: true
      selector:
        select:
          options: [constant, wave, pulse, surge, random]
    low:
      name: Minimum
      description: Minimum speed in % (wave, pulse, surge, random).
      default: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    high:
      name: Maximum
      description: Maximum speed in % (wave, pulse, surge, random).
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    level:
      name: Level
      description: Speed in % for constant mode.
      default: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    period:
      name: Period
      description: Seconds per cycle (wave, pulse, surge).
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    pulse:
      name: Pulse time
      description: Seconds at the maximum per period (pulse). Must be below the period.
      default: 5
      selector:
        number:
          min: 0.1
          max: 3600
          step: 0.1
          unit_of_measurement: s
    interval:
      name: Random interval
      description: Seconds between new random targets (random).
      default: 10
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
    fade:
      name: Cross-fade
      description: Seconds to blend from the current wave to this one.
      default: 5
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s
