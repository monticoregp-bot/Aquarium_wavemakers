name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (engine, firmware parity, Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest tests/

  esphome:
    name: ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome
      - run: |
          cp esphome/wavemaker.yaml esphome/wave_engine.h /tmp/
          cd /tmp
          printf 'wifi_ssid: x\nwifi_password: xxxxxxxxxx\nfallback_password: xxxxxxxxxx\nota_password: x\napi_key: "%s"\n' "$(python -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')" > secrets.yaml
          esphome config wavemaker.yaml
